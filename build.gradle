plugins {
	id("dev.kikugie.loom-back-compat")
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName.set("tilted+" + (property("minecraft_version") as String))
}
repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	// mod compat repos
	maven { name = "LadySnake (Enchancement)"; url = "https://maven.ladysnake.org/releases" }; /* dependencies .-. */ maven { name = "TerraformersMC (Mod Menu)"; url = "https://maven.terraformersmc.com/releases" }; maven { name = "UpCraft (DataSync)"; url = "https://maven.uuid.gg/releases" };
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tilted" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "tilted"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:" + property("minecraft_version") as String

	loomx.applyMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:" + property("loader_version") as String

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:" + property("fabric_api_version") as String

	// to test mod compat
	{ def prop = findProperty("compat_enchancement_version") as String; if (prop != null) modImplementation prop }
}

processResources {
	def version = project.version
	inputs.property "version", version

	def minecraft = stonecutter.current.version
	def injection = "$minecraft" as String

	filesMatching("fabric.mod.json") {
		expand "version": version,
				"minecraft_version": injection
	}
}

def version = findProperty("java_version") as Integer ?: 21

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain { languageVersion = JavaLanguageVersion.of(version) }

	sourceCompatibility = JavaVersion.toVersion(version)
	targetCompatibility = JavaVersion.toVersion(version)
}

tasks.withType(JavaCompile).configureEach { options.release = version }

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
